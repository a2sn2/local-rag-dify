app:
  description: Local bilingual Arabic/English grounded RAG Chatflow featuring visual
    node graph with explicit evidence validation and abstention branch.
  icon: ⚡
  icon_background: '#D1FADF'
  icon_type: emoji
  mode: advanced-chat
  name: Local Bilingual RAG Chatflow
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/ollama:1.0.3@1086758302d98263d5b7881de8ba95fc219351fdf97831d18a7807378674d203
    version: null
kind: app
site:
  chat_color_theme: null
  chat_color_theme_inverted: false
  copyright: null
  custom_disclaimer: ''
  default_language: ar-TN
  description: null
  icon: ⚡
  icon_background: '#D1FADF'
  icon_type: emoji
  input_placeholder: null
  privacy_policy: null
  show_workflow_steps: true
  title: Local Bilingual RAG Chatflow
  use_icon_as_answer_icon: false
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      enabled: false
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - id: start-retrieval
      source: start
      sourceHandle: source
      target: retrieval
      targetHandle: target
    - id: retrieval-evidence_check
      source: retrieval
      sourceHandle: source
      target: evidence_check
      targetHandle: target
    - id: evidence_check-llm
      source: evidence_check
      sourceHandle: 'true'
      target: llm
      targetHandle: target
    - id: llm-answer_grounded
      source: llm
      sourceHandle: source
      target: answer_grounded
      targetHandle: target
    - id: evidence_check-answer_abstain
      source: evidence_check
      sourceHandle: 'false'
      target: answer_abstain
      targetHandle: target
    nodes:
    - data:
        title: Start
        type: start
        variables: []
      id: start
      position:
        x: 80
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
    - data:
        dataset_ids:
        - em5J3A0erazlwFG1RBbdloG75aaem8yL6b6T6pRoeIupY/B6nNgjOlAK6CYGL57z
        multiple_retrieval_config:
          reranking_enable: false
          reranking_mode: weighted_score
          score_threshold: null
          top_k: 6
        query_variable_selector:
        - sys
        - query
        retrieval_mode: single
        single_retrieval_config:
          model:
            completion_params: {}
            mode: chat
            name: qwen3.5:4b
            provider: langgenius/ollama/ollama
        title: Knowledge Retrieval
        type: knowledge-retrieval
      id: retrieval
      position:
        x: 380
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: not empty
            value: ''
            variable_selector:
            - retrieval
            - result
          logical_operator: and
        conditions:
        - comparison_operator: not empty
          value: ''
          variable_selector:
          - retrieval
          - result
        logical_operator: and
        title: Evidence Check
        type: if-else
      id: evidence_check
      position:
        x: 680
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
    - data:
        context:
          enabled: true
          variable_selector:
          - retrieval
          - result
        memory:
          query_prompt_template: '{{#sys.query#}}'
          window:
            enabled: false
            size: 10
        model:
          completion_params:
            max_tokens: 512
            stop: []
            temperature: 0.1
            think: false
            top_p: 0.9
          mode: chat
          name: qwen3.5:4b
          provider: langgenius/ollama/ollama
        prompt_template:
        - role: system
          text: "أنت مساعد تقني مؤسسي ذكي ثنائي اللغة (العربية والإنجليزية) متخصص\
            \ في الإجابة على الاستفسارات الفنية بدقة وموثوقية عالية استناداً حصراً\
            \ إلى الوثائق التقنية المرفقة.\n\nالقواعد الصارمة الملزمة:\n1. الالتزام\
            \ المطلق بالسياق (Strict Grounding): اعتمد حصراً وبشكل صارم على المعلومات\
            \ والحقائق الواردة في نصوص الوثائق المرفقة (Context). لا تقدم أي إجابة\
            \ بناءً على معرفتك الخارجية المسبقة أو تخميناتك.\n2. منع الهلوسة الصارم\
            \ (Anti-Hallucination): يُحظر تماماً التخمين، أو افتراض حقائق غير موجودة،\
            \ أو تأليف أي أرقام، ميزانيات، جداول رحلات، تواريخ، أو مواصفات غير مذكورة\
            \ نصاً.\n3. التوثيق والاقتباس الداخلي الصريح (Inline Citations):\n   -\
            \ يجب في نهاية كل معلومة أو إجابة كتابة اسم ملف الوثيقة الفعلي وعنوان\
            \ القسم المقتبس منه بدقة، مثل: [saudi_tech_initiatives.ar.md, قسم 1] أو\
            \ [cloud_architecture_standards.en.md, Section 2].\n   - تحذير صارم: يُحظر\
            \ نهائياً وبشكل قاطع استخدام نصوص بديلة (Placeholders) أو عبارات عامة\
            \ مثل \"[اسم الوثيقة]\" أو \"[رقم الفقرة]\" أو \"[Document Name]\" أو\
            \ \"[Section X]\" أو \"[السياق]\". اكتب دائماً اسم الملف الحقيقي من السياق.\n\
            4. الامتناع الصريح في حال عدم التوفر أو الاستفسارات المضللة (Explicit\
            \ Abstention):\n   - إذا كان سؤال المستخدم يتعلق بموضوع غير مدعوم، أو\
            \ حقائق غير موجودة، أو يستند إلى وثيقة مزيفة/غير مرفقة (مثل تقرير دبي،\
            \ أو ميزانية غير مذكورة، أو رحلات طيران، أو إحصائيات لم ترد)، أو كان استفساراً\
            \ مضللاً أو مقارنة مع مصادر غير موجودة، فيجب عليك الامتناع عن الإجابة\
            \ فوراً وكتابة النص التالي حرفياً:\n   \"المعلومة المطلوبة غير متوفرة\
            \ في الوثائق المرفقة.\nThe requested information is not available in the\
            \ provided documents.\"\n   لا تحاول تخمين أو تقديم إجابة جزئية غير موثقة\
            \ على الإطلاق.\n5. الدقة اللغوية والاصطلاحية: أجب بنفس لغة السؤال (العربية\
            \ أو الإنجليزية). حافظ على دقة المصطلحات والوحدات بدقة (مثل الرموز البرمجية،\
            \ ووحدات القياس كالرموز Tokens بدلاً من الكلمات Words إن نصت الوثيقة على\
            \ ذلك).\n\nالسياق المرفق:\n{{#context#}}\n"
        - role: user
          text: '{{#sys.query#}}'
        title: LLM (Qwen3.5 4B)
        type: llm
        vision:
          enabled: false
      id: llm
      position:
        x: 980
        y: 180
      sourcePosition: right
      targetPosition: left
      type: custom
    - data:
        answer: '{{#llm.text#}}'
        title: Answer (Grounded)
        type: answer
        variables: []
      id: answer_grounded
      position:
        x: 1280
        y: 180
      sourcePosition: right
      targetPosition: left
      type: custom
    - data:
        answer: 'المعلومة المطلوبة غير متوفرة في الوثائق المرفقة.


          The requested information is not available in the provided documents.'
        title: Answer (Abstention)
        type: answer
        variables: []
      id: answer_abstain
      position:
        x: 980
        y: 420
      sourcePosition: right
      targetPosition: left
      type: custom
  rag_pipeline_variables: []
