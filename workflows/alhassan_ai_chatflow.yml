        title: Knowledge Retrieval
        type: knowledge-retrieval
      id: retrieval
      position:
        x: 380
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: not empty
            value: ''
            variable_selector:
            - retrieval
            - result
          logical_operator: and
        conditions:
        - comparison_operator: not empty
          value: ''
          variable_selector:
          - retrieval
          - result
        logical_operator: and
        title: Evidence Check
        type: if-else
      id: evidence_check
      position:
        x: 680
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
    - data:
        context:
          enabled: true
          variable_selector:
          - retrieval
          - result
        memory:
          query_prompt_template: '{{#sys.query#}}'
          window:
            enabled: false
            size: 10
        model:
          completion_params:
            max_tokens: 768
            stop: []
            temperature: 0.1
            think: false
            top_p: 0.9
          mode: chat
          name: qwen3.5:4b
          provider: langgenius/ollama/ollama
        prompt_template:
        - role: system
          text: "أنت \"ALHassan AI\" — المساعد الذكي الرسمي والممثل المعرفي للمهندس\
            \ الحسن بليغ الشامي (ALHassan Baligh ALShami).\nمهمتك تقديم إجابات دقيقة،\
            \ موثقة، احترافية، ومطابقة تماماً لقاعدة المعرفة المرفقة فقط، مع الالتزام\
            \ الصارم بالقواعد المعمارية التالية:\n\n1. الحقيقة والحدود المعرفية (Strict\
            \ Factual Grounding):\n   - اعتمد حصرياً وبنسبة 100% على النصوص والمعلومات\
            \ الواردة في السياق المرفق أدناه.\n   - لا تخترع أو تخمن أو تفترض أي معلومة\
            \ غير موجودة صراحة (No Speculation / Zero Hallucination).\n   - إذا سُئلت\
            \ عن معلومات شخصية حساسة، أو أسرار عمل، أو تفاصيل غير معلنة (مثل: الرواتب،\
            \ الأرباح، مفاتيح التشفير، تفاصيل قواعد بيانات العملاء، رقم المنزل السكني،\
            \ تاريخ الميلاد الكامل، أو مشاريع خارجية غير مسجلة كإدارة مطارات دولية)،\
            \ يجب عليك الامتناع فوراً وبشكل صريح وواضح ومهني.\n\n2. صيغة الامتناع\
            \ المهني (Deterministic Abstention Format):\n   - عند غياب المعلومة أو\
            \ طلب بيانات خارج النطاق، أجب بالصيغة المباشرة:\n     \"لا تتوفر لدي معلومات\
            \ موثقة عن هذا الموضوع ضمن قاعدة المعرفة الحالية الخاصة بالحسن بليغ الشامي.\"\
            \n     (مع إضافة الترجمة الإنجليزية المقابلة إذا كان الاستعلام بلغة أجنبية).\n\
            \n3. النزاهة الهندسية وحالات التوثيق (Integrity & Evidence Status):\n\
            \   - ميز بدقة بين المشاريع الموثقة بأدلة وروابط مستودعات مفتوحة (Verified)\
            \ وبين الاعتمادات غير المثبتة دولياً.\n   - إذا سُئلت عن شهادة CompTIA\
            \ A+، وضح أنها دورة تدريبية صادرة من معهد نيوهورايزن في صنعاء ولم يتم\
            \ إثبات الاعتماد الدولي المستقل من CompTIA العالمية.\n\n4. التوافق اللغوي\
            \ (Multilingual Alignment):\n   - أجب باللغة العربية افتراضياً وبأسلوب\
            \ مهني رفيع.\n   - إذا كان سؤال المستخدم باللغة الإنجليزية، أجب باللغة\
            \ الإنجليزية بالكامل.\n   - إذا كان سؤال المستخدم باللغة الألمانية، أجب\
            \ باللغة الألمانية بالكامل.\n\n5. الإسناد المرجعي (Attribution):\n   -\
            \ اذكر باختصار في نهاية الإجابة القسم المعتمد من السيرة الذاتية (مثل:\
            \ [بحسب سجل المشاريع الهندسية] أو [وفقاً لبيانات السجل المهني]).\n\nالسياق\
            \ المرفق من قاعدة المعرفة:\n{{#context#}}\n"
        - role: user
          text: '{{#sys.query#}}'
        title: LLM (Qwen3.5 4B)
        type: llm
        vision:
          enabled: false
      id: llm
      position:
        x: 980
        y: 180
      sourcePosition: right
      targetPosition: left
      type: custom
    - data:
        answer: '{{#llm.text#}}'
        title: Answer (Grounded)
        type: answer
        variables: []
      id: answer_grounded
      position:
        x: 1280
        y: 180
      sourcePosition: right
      targetPosition: left
      type: custom
    - data:
        answer: 'لا تتوفر لدي معلومات موثقة عن هذا الموضوع ضمن قاعدة المعرفة الحالية
          الخاصة بالحسن بليغ الشامي.


          The requested information is not available in the verified knowledge base
          of ALHassan Baligh ALShami.'
        title: Answer (Abstention)
        type: answer
        variables: []
      id: answer_abstain
      position:
        x: 980
        y: 420
      sourcePosition: right
      targetPosition: left
      type: custom
  rag_pipeline_variables: []
