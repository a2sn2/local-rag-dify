      source: evidence_check
      sourceHandle: 'true'
      target: llm
      targetHandle: target
    - id: llm-answer_grounded
      source: llm
      sourceHandle: source
      target: answer_grounded
      targetHandle: target
    - id: evidence_check-answer_abstain
      source: evidence_check
      sourceHandle: 'false'
      target: answer_abstain
      targetHandle: target
    nodes:
    - data:
        title: Start
        type: start
        variables: []
      id: start
      position:
        x: 80
        y: 282
      sourcePosition: right
      targetPosition: left
      type: custom
    - data:
        dataset_ids:
        - iFhuCRMMBcdJ6L6kSdHEa8dYlazl17TlidvMR9LmVkiIBQp62oEfMm7cGasSMaUF
        multiple_retrieval_config:
          reranking_enable: false
          reranking_mode: reranking_model
          reranking_model: null
          score_threshold: 0.35
          top_k: 5
        query_variable_selector:
        - sys
        - query
