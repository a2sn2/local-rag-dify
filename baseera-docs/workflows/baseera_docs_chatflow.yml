app:
  description: بصيرة — المساعد الذكي والودود لتحليل وتدقيق الوثائق التجارية، العقود،
    الاتفاقيات، وكشف المخاطر والالتزامات التعاقدية.
  icon: 📑
  icon_background: '#E0F2FE'
  icon_type: emoji
  mode: advanced-chat
  name: بصيرة — Baseera Docs
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/ollama:1.0.3@1086758302d98263d5b7881de8ba95fc219351fdf97831d18a7807378674d203
    version: null
kind: app
site:
  chat_color_theme: null
  chat_color_theme_inverted: false
  copyright: null
  custom_disclaimer: ''
  default_language: ar-TN
  description: null
  icon: 📑
  icon_background: '#E0F2FE'
  icon_type: emoji
  input_placeholder: null
  privacy_policy: null
  show_workflow_steps: true
  title: بصيرة — Baseera Docs
  use_icon_as_answer_icon: false
version: 0.7.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .pdf
      - .docx
      - .md
      - .txt
      allowed_file_types:
      - document
      - custom
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: true
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - id: start-file_check
      source: start
      sourceHandle: source
      target: file_check
      targetHandle: target
    - id: file_check-document_extractor
      source: file_check
      sourceHandle: 'true'
      target: document_extractor
      targetHandle: target
    - id: document_extractor-llm_uploaded
      source: document_extractor
      sourceHandle: source
      target: llm_uploaded
      targetHandle: target
    - id: llm_uploaded-answer_uploaded
      source: llm_uploaded
      sourceHandle: source
      target: answer_uploaded
      targetHandle: target
    - id: file_check-knowledge_retrieval
      source: file_check
      sourceHandle: 'false'
      target: knowledge_retrieval
      targetHandle: target
    - id: knowledge_retrieval-llm
      source: knowledge_retrieval
      sourceHandle: source
      target: llm
      targetHandle: target
    - id: llm-answer
      source: llm
      sourceHandle: source
      target: answer
      targetHandle: target
    nodes:
    - data:
        title: Start
        type: start
        variables: []
      id: start
      position:
        x: 60
        y: 280
      sourcePosition: right
      targetPosition: left
      type: custom
    - data:
        _targetBranches:
        - id: 'true'
          name: IF
        - id: 'false'
          name: ELSE
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: not empty
            id: has_uploaded_files
            value: ''
            variable_selector:
            - sys
            - files
          logical_operator: and
        conditions:
        - comparison_operator: not empty
          id: has_uploaded_files
          value: ''
          variable_selector:
          - sys
          - files
        logical_operator: and
        title: Uploaded File Check
        type: if-else
      id: file_check
      position:
        x: 320
        y: 280
      sourcePosition: right
      targetPosition: left
      type: custom
    - data:
        is_array_file: true
        title: Document Extractor
        type: document-extractor
        variable_selector:
        - sys
        - files
      id: document_extractor
      position:
        x: 600
        y: 140
      sourcePosition: right
      targetPosition: left
      type: custom
    - data:
        context:
          enabled: false
          variable_selector: []
        memory:
          query_prompt_template: ''
          window:
            enabled: false
            size: 0
        model:
          completion_params:
            max_tokens: 900
            stop: []
            temperature: 0.1
            think: false
            top_p: 0.9
          mode: chat
          name: qwen3.5:4b
          provider: langgenius/ollama/ollama
        prompt_template:
        - role: system
          text: "You are \"بصيرة — Baseera Docs\", a friendly, accurate assistant\
            \ for analyzing uploaded PDF/DOCX/MD/TXT documents.\n\nMANDATORY RULES:\n\
            1. FACTUAL CONTEXT GUARANTEE: The user ALWAYS attached a valid file in\
            \ this branch and Document Extractor ALREADY extracted it. NEVER say \"\
            no file was provided\" or ask them to upload a file again!\n2. OVERSIZED\
            \ DOCUMENT & TRUNCATION GUARD (CRITICAL):\n   - Local inference uses a\
            \ ~4096-token single-pass window.\n   - If EITHER `=== START OF EXTRACTED\
            \ DOCUMENT ===` OR `=== END OF EXTRACTED DOCUMENT ===` is missing, OR\
            \ the text between them appears cut off / blank (dropped by the 4096-token\
            \ runtime limit), DO NOT pretend no file was uploaded and DO NOT invent\
            \ missing clauses! Explicitly inform the user in their language: that\
            \ their attached document was received and extracted, but its full size\
            \ exceeds the local single-pass ~4096-token processing limit (تم استلام\
            \ المستند المرفق واستخراج نصه، غير أن حجمه الكلي يتجاوز حد نافذة السياق\
            \ المحلية ~4096 توكن للمعالجة في دفعة واحدة). Summarize only any visible\
            \ snippet if present, and recommend focusing on a single clause or splitting\
            \ the file.\n3. Analyze ONLY extracted document text between the markers.\
            \ Never fabricate clauses, numbers, IDs, or parties. Extract parties,\
            \ dates, amounts & currencies, durations, penalties, mutual obligations,\
            \ termination rules, and report blank/omitted fields explicitly. When\
            \ 2 files are uploaded, compare them cleanly.\n4. THREE-LEVEL GROUNDING\
            \ + STRICT LANGUAGE RULE:\n   - Distinguish quoted facts vs logical risk\
            \ analysis (add non-legal-advice disclaimer) vs missing items.\n   - Strictly\
            \ answer in the SAME language as the user's question (English for English\
            \ questions; friendly Arabic for Arabic questions).\n"
        - role: user
          text: '=== START OF EXTRACTED DOCUMENT ===

            {{#document_extractor.text#}}

            === END OF EXTRACTED DOCUMENT ===


            User Question / سؤال المستخدم:

            {{#sys.query#}}'
        title: LLM (Uploaded Document)
        type: llm
        vision:
          enabled: false
      id: llm_uploaded
      position:
        x: 880
        y: 140
      sourcePosition: right
      targetPosition: left
      type: custom
    - data:
        answer: '{{#llm_uploaded.text#}}'
        title: Answer (Uploaded Doc)
        type: answer
        variables: []
      id: answer_uploaded
      position:
        x: 1160
        y: 140
      sourcePosition: right
      targetPosition: left
      type: custom
    - data:
        dataset_ids:
        - IUzLzwz7Riw051NulPTwtiT+MVXAVn+KaYudFUDL8u1TRQ1cTaB0RHVROC3Rb/CY
        multiple_retrieval_config:
          reranking_enable: false
          reranking_mode: reranking_model
          reranking_model: null
          score_threshold: 0.25
          top_k: 10
        query_variable_selector:
        - sys
        - query
        retrieval_mode: multiple
        title: Knowledge Retrieval
        type: knowledge-retrieval
      id: knowledge_retrieval
      position:
        x: 600
        y: 420
      sourcePosition: right
      targetPosition: left
      type: custom
    - data:
        context:
          enabled: true
          variable_selector:
          - knowledge_retrieval
          - result
        memory:
          query_prompt_template: '{{#sys.query#}}'
          window:
            enabled: true
            size: 4
        model:
          completion_params:
            max_tokens: 900
            stop: []
            temperature: 0.1
            think: false
            top_p: 0.9
          mode: chat
          name: qwen3.5:4b
          provider: langgenius/ollama/ollama
        prompt_template:
        - role: system
          text: "You are \"بصيرة — Baseera Docs\", a friendly, accurate assistant\
            \ for analyzing contracts, agreements, and business documents.\n\nSTRICT\
            \ RULES (MANDATORY):\n1. STRICT DOCUMENT & VERSION SEPARATION:\n   - Each\
            \ excerpt begins with a tag like `[الوثيقة: ...]` or `[Doc: ...]`. Read\
            \ the tag BEFORE attributing ANY number, duration, or rule. Never mix\
            \ \"النسخة النهائية\" vs \"v1.0.0\" or mix UK/Bonterms/Arabic contracts.\n\
            \   - In Arabic contracts (\"عقد الحلول الرقمية\"): First Party (الطرف\
            \ الأول) = Customer/Client; Second Party (الطرف الثاني) = Company/Provider.\n\
            \   - CONVERSATION MEMORY OVERRIDE FOR UPLOAD FOLLOW-UPS: If conversation\
            \ history clearly shows the user previously uploaded/analyzed a specific\
            \ external file (e.g., an earlier uploaded PDF/DOCX not in KB) and the\
            \ current follow-up refers back to THAT uploaded document (\"في نفس العقد\
            \ الذي حللته للتو\", \"in that attached file\"), answer strictly using\
            \ ONLY what was extracted in conversation history (and clearly note any\
            \ unextracted detail, asking them to re-attach the file if needed) — NEVER\
            \ substitute unrelated static KB contracts.\n2. ZERO CITATION FABRICATION:\n\
            \   - Quote ONLY clause numbers, amounts, currencies, percentages, and\
            \ durations that appear verbatim in the retrieved excerpts. Report empty\
            \ placeholders `[.....]%` explicitly as unspecified/blank.\n   - When\
            \ comparing multiple clauses or versions, if one clause is missing from\
            \ the retrieved snippets, explicitly state that snippet was not retrieved\
            \ without denying its existence in the full contract.\n3. THREE-LEVEL\
            \ GROUNDING:\n   - Level A (Explicit Fact): Answer directly with exact\
            \ doc tag + clause quote.\n   - Level B (Reasonable Analysis/Risk): Provide\
            \ balanced reasoning grounded in text + include \"(ملاحظة: هذا التحليل\
            \ استرشادي منطقي وليس استشارة قانونية نظامية رسمية)\" (or English equivalent\
            \ when answering in English).\n   - Level C (Not Found / Missing): Clearly\
            \ state the item is not specified in the provided excerpts and refuse\
            \ to invent data.\n4. STRICT LANGUAGE RULE:\n   - Match the user's question\
            \ language strictly: answer in clear English when the question is in English,\
            \ and in clear, friendly Modern Standard Arabic when the question is in\
            \ Arabic.\n\nRetrieved Knowledge Context:\n{{#context#}}\n"
        - role: user
          text: '{{#sys.query#}}'
        title: LLM (Baseera KB Qwen 4B)
        type: llm
        vision:
          enabled: false
      id: llm
      position:
        x: 880
        y: 420
      sourcePosition: right
      targetPosition: left
      type: custom
    - data:
        answer: '{{#llm.text#}}'
        title: Answer (KB)
        type: answer
        variables: []
      id: answer
      position:
        x: 1160
        y: 420
      sourcePosition: right
      targetPosition: left
      type: custom
  rag_pipeline_variables: []
