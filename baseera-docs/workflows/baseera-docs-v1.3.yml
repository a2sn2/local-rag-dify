          name: Uploaded Document Follow Up
        instruction: 'CRITICAL CONTEXT: The user ALREADY uploaded a contract, internal
          policy/bylaw, or app Terms PDF/DOCX earlier in this conversation. By DEFAULT,
          almost EVERY follow-up question in this session asks about THAT uploaded
          document. (1) Choose Uploaded Document Follow Up for ANY question about
